<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .temp-hot   { color: #ff5555; }
      .temp-warm  { color: #ffb86c; }
      .dim        { color: #888888; }

      body, html {
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        padding: 0.6rem 0.5rem;
        box-sizing: border-box;
      }

      html {
        background-color: rgb(30, 30, 30);
        color: rgb(240, 240, 240);
        font-family: Consolas, "SFMono-Regular", "Liberation Mono", Menlo, Monaco, monospace;
      }

      /* Floating Fullscreen Toggle Button at 75% width */
      #fullscreen-btn {
        position: fixed;
        top: 0.5rem;
        left: 75%;
        transform: translateX(-50%);
        z-index: 2000;
        background: #2a2a2a;
        color: #888888;
        border: 1px solid #383838;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 0.75rem;
        cursor: pointer;
        font-family: inherit;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        transition: background 0.2s, color 0.2s;
        white-space: nowrap;
      }

      #fullscreen-btn:hover {
        background: #383838;
        color: #ffffff;
      }

      body > pre {
        position: relative;
        margin-top: 0;
        margin-bottom: 1.1rem;
        padding-bottom: 1.1rem;
        padding-right: 2.5rem;
        border-bottom: 1px solid #383838;
      }

      body > pre:last-child {
        margin-bottom: 0;
        border-bottom: none;
      }

      pre {
        font-size: clamp(1rem, 2.5vw, 1.5rem);
      }

      #fps {
        margin-top: 0;
        display: flex;
        align-items: center;
        min-height: 1.5rem;
      }

      .section-controls {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .btn-order {
        background: #2a2a2a;
        color: #888888;
        border: 1px solid #383838;
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 0.65rem;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
      }

      .btn-order:hover:not(:disabled) {
        background: #383838;
        color: #ffffff;
      }

      .btn-order:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        border-color: #2a2a2a;
      }

      .badge {
        display: inline-block;
        padding: 0.05em 0.3em;
        font-weight: bold;
        border-radius: 3px;
        letter-spacing: 0.5px;
      }

      .badge-gpu {
        color: #E60012;
        border: 1px solid #E60012;
        box-shadow: 0 0 8px rgba(230, 0, 19, 0.322);
      }

      .badge-cpu {
        color: #ED5C2B;
        border: 1px solid #ED5C2B;
        box-shadow: 0 0 8px rgba(237, 91, 43, 0.308);
      }

      .bar {
        display: inline-block;
        font-size: 0.6em;
        line-height: 1;
        vertical-align: middle;
      }

      .core-row {
        display: flex;
        flex-wrap: wrap;
        column-gap: 1ch;
        row-gap: 0.2rem;
        margin-bottom: 0.2rem;
      }

      .core-info {
        white-space: pre;
      }

      .core-bar {
        white-space: pre;
      }

      @media screen and (min-width: 600px) {
        body {
          padding: 0.6rem 0.5rem;
        }
      }

      @media screen and (min-width: 1024px) {
        body {
          padding: 2.5rem 4rem;
          max-width: 1400px;
          margin: 0 auto;
        }

        #fullscreen-btn {
          left: 50%;
        }
      }

    </style>
  </head>
<body>

<button id="fullscreen-btn" onclick="toggleFullscreen()">Enter Fullscreen</button>

<pre id="fps" style="order: 1;"><div class="section-controls"><button class="btn-order btn-up" onclick="moveSection(this, -1)">▲</button><button class="btn-order btn-down" onclick="moveSection(this, 1)">▼</button></div><span class="content"></span></pre>
<pre id="gpu" style="order: 2;"><div class="section-controls"><button class="btn-order btn-up" onclick="moveSection(this, -1)">▲</button><button class="btn-order btn-down" onclick="moveSection(this, 1)">▼</button></div><span class="content"></span></pre>
<pre id="cpu" style="order: 3;"><div class="section-controls"><button class="btn-order btn-up" onclick="moveSection(this, -1)">▲</button><button class="btn-order btn-down" onclick="moveSection(this, 1)">▼</button></div><span class="content"></span></pre>
<pre id="process" style="order: 4;"><div class="section-controls"><button class="btn-order btn-up" onclick="moveSection(this, -1)">▲</button><button class="btn-order btn-down" onclick="moveSection(this, 1)">▼</button></div><span class="content"></span></pre>

<script>
const NA = "--";
const STORAGE_KEY = "overlay_section_orders";

const val = (v, fallback = NA) => v ?? fallback;
const metric = (obj, fallback = NA) => obj?.value ?? fallback;
const fixed = (v, digits = 1, fallback = NA) => typeof v === "number" ? v.toFixed(digits) : fallback;
const dim = (text) => `<span class="dim">${text}</span>`;
const badgeGpu = (text) => `<span class="badge badge-gpu">${text}</span>`;
const badgeCpu = (text) => `<span class="badge badge-cpu">${text}</span>`;

let previousFps = null;

let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    } else {
      console.warn('Wake Lock API not available');
    }
  } catch (err) {
    console.warn('Wake Lock request failed:', err.name, err.message);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try {
      await wakeLock.release();
    } catch (err) {}
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && document.fullscreenElement && !wakeLock) {
    await requestWakeLock();
  }
});

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener('fullscreenchange', async () => {
  const btn = document.getElementById('fullscreen-btn');
  if (document.fullscreenElement) {
    btn.textContent = 'Exit Fullscreen';
    await requestWakeLock();
  } else {
    btn.textContent = 'Enter Fullscreen';
    await releaseWakeLock();
  }
});

function saveOrders() {
  const orders = {};
  document.querySelectorAll('body > pre').forEach(pre => {
    if (pre.id) {
      orders[pre.id] = pre.style.order;
    }
  });
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
  } catch (e) {}
}

function loadOrders() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    const orders = JSON.parse(saved);
    Object.entries(orders).forEach(([id, order]) => {
      const pre = document.getElementById(id);
      if (pre) pre.style.order = order;
    });
  } catch (e) {}
}

function updateButtonStates() {
  const allPres = Array.from(document.querySelectorAll('body > pre'));
  allPres.sort((a, b) => parseInt(a.style.order || 0) - parseInt(b.style.order || 0));

  allPres.forEach((pre, index) => {
    const btnUp = pre.querySelector('.btn-up');
    const btnDown = pre.querySelector('.btn-down');

    if (btnUp) btnUp.disabled = (index === 0);
    if (btnDown) btnDown.disabled = (index === allPres.length - 1);
  });
}

function moveSection(btn, direction) {
  const currentPre = btn.closest('pre');
  const allPres = Array.from(document.querySelectorAll('body > pre'));

  allPres.sort((a, b) => parseInt(a.style.order || 0) - parseInt(b.style.order || 0));

  const currentIndex = allPres.indexOf(currentPre);
  const targetIndex = currentIndex + direction;

  if (targetIndex >= 0 && targetIndex < allPres.length) {
    const targetPre = allPres[targetIndex];
    
    const tempOrder = currentPre.style.order;
    currentPre.style.order = targetPre.style.order;
    targetPre.style.order = tempOrder;

    updateButtonStates();
    saveOrders();
  }
}

function formatHotspotDelta(gpuTemp, hotspotTemp) {
  if (typeof gpuTemp !== "number" || typeof hotspotTemp !== "number") return "";
  const delta = Math.round(hotspotTemp - gpuTemp);
  if (delta <= 0) return "";
  const text = ` (+${delta})`;
  if (delta > 40) return `<span class="temp-hot">${text}</span>`;
  if (delta > 25) return `<span class="temp-warm">${text}</span>`;
  return `<span class="dim">${text}</span>`;
}

function colorTemp(temp) {
  if (typeof temp !== "number") return `<span>${NA}</span>`;
  const formatted = temp.toFixed(1);
  if (temp >= 100) return `<span class="temp-hot">${formatted}</span>`;
  if (temp >= 95)  return `<span class="temp-warm">${formatted} </span>`;
  return `<span>${formatted} </span>`;
}

function colorFan(fanSpeed, hotspot) {
  if (typeof fanSpeed !== "number") return `<span>${NA}</span>`;
  if (fanSpeed < 500 && typeof hotspot === "number" && hotspot > 90) return `<span class="temp-hot">${fanSpeed}</span>`;
  if (fanSpeed <= 300 && typeof hotspot === "number" && hotspot > 80) return `<span class="temp-warm">${fanSpeed}</span>`;
  return `<span>${fanSpeed}</span>`;
}

function formatFpsDelta(currentFps, previousFps) {
  if (typeof currentFps !== "number" || typeof previousFps !== "number") return "";
  const delta = Math.round(currentFps - previousFps);
  if (delta === 0) return "";
  const text = ` (${delta > 0 ? "+" : ""}${delta})`;
  if (delta < -20) return `<span class="temp-hot">${text}</span>`;
  if (delta < -10) return `<span class="temp-warm">${text}</span>`;
  return `<span class="dim">${text}</span>`;
}

async function update() {
  const r = await fetch(location.pathname.replace(/\/$/, "") + "/api");
  if (!r.ok) throw new Error(`HTTP ${r.status}`);

  const data = await r.json();

  const gpuData = data?.gpu ?? {};
  const cpuData = data?.cpu ?? {};
  const processes = Array.isArray(data?.processes) ? data.processes : [];
  const cores = Array.isArray(cpuData.cores) ? cpuData.cores : [];

  const gpuName = val(gpuData.name);
  const cpuName = val(cpuData.name);

  const totalUsage = cores.reduce((sum, c) => sum + (typeof c?.u === "number" ? c.u : 0), 0);
  const avgLoad = cores.length > 0 ? totalUsage / cores.length : null;

  const fanVal = metric(gpuData.fan_speed);
  const hotspotVal = metric(gpuData.hotspot);

  const gpuTempMetric = metric(gpuData.temperature);
  const hotspotMetric = metric(gpuData.hotspot);

  const deltaTag = formatHotspotDelta(gpuTempMetric, hotspotMetric);

  document.querySelector("#gpu .content").innerHTML =
  `${dim("GPU:")} ${gpuName !== NA ? badgeGpu(gpuName) : NA}

  ${dim("Temp:")}       ${colorTemp(gpuTempMetric)} ${dim("°C")}
  ${dim("Hotspot:")}    ${colorTemp(hotspotMetric)} ${dim("°C")}${deltaTag}
  ${dim("Mem Temp:")}   ${colorTemp(metric(gpuData.memory_temperature))} ${dim("°C")}
  ${dim("Fan Speed:")}  ${colorFan(fanVal, hotspotMetric)} ${dim("RPM")}
  ${dim("Power:")}      ${metric(gpuData.total_board_power)} ${dim("W")}
  ${dim("Clock:")}      ${metric(gpuData.clock_speed)} ${dim("MHz")}
  ${dim("Voltage:")}    ${metric(gpuData.voltage)} ${dim("mV")}
  ${dim("VRAM:")}       ${metric(gpuData.vram)} ${dim("MB")}
  ${dim("VRAM Clock:")} ${metric(gpuData.vram_clock_speed)} ${dim("MHz")}`;

  let cpuText =
`${dim("CPU:")} ${cpuName !== NA ? badgeCpu(cpuName) : NA}

${colorTemp(cpuData.temperature)} ${dim("°C")},  ${val(cpuData.power)} ${dim("W")},  ${fixed(avgLoad)} ${dim("%")}

`;

  cores.forEach((c, i) => {
    const usage = typeof c?.u === "number" ? c.u : 0;
    const tempVal = typeof c?.t === "number" ? c.t : null;
    const clockVal = typeof c?.c === "number" ? c.c : null;

    const barLength = 30;
    const filled = Math.round((usage / 100) * barLength);
    const bar = `<span class="bar">` + "█".repeat(filled) + dim(".".repeat(barLength - filled)) + `</span>`;

    const coreLabel = dim(`${String(i).padStart(2)}:`);
    const unitDeg = dim("°C");
    const unitMhz = dim("MHz");
    const unitPercent = dim("%");

    cpuText += `<div class="core-row">
      <span class="core-info">${coreLabel} ${colorTemp(tempVal)} ${unitDeg} ${fixed(clockVal, 0).padStart(6)} ${unitMhz} ${fixed(c?.u).padStart(5)}${unitPercent}</span>
      <span class="core-bar">[${bar}]</span>
    </div>`;
  });

  document.querySelector("#cpu .content").innerHTML = cpuText;

  const fpsValue = data?.fps < 0 ? null : data?.fps;
  const fpsDelta = formatFpsDelta(fpsValue, previousFps);

  document.querySelector("#fps .content").innerHTML = `${dim("FPS:")} ${typeof fpsValue === "number" ? fpsValue.toFixed(0) : NA}${fpsDelta}`;

  if (typeof fpsValue === "number") {
    previousFps = fpsValue;
  }

  let processText = `${dim("Processes:")}\n\n`;

  for (let i = 0; i < 5; i++) {
    const p = processes[i];
    if (p) {
      const name = p?.name ?? NA;
      const cpu = fixed(p?.cpu);
      processText += `${dim(`${String(i + 1).padStart(2)}.`)} ${name.padEnd(18)} ${cpu.padStart(5)}${dim("%")}\n`;
    } else {
      const processName = NA.padEnd(18);
      processText += `${dim(`${String(i + 1).padStart(2)}.`)} ${processName} ${"0".padStart(5)}${dim("%")}\n`;
    }
  }

  document.querySelector("#process .content").innerHTML = processText;
}

let failedAttempts = 0;
const MAX_FAILURES = 3;

async function loop() {
  try {
    await update();
    failedAttempts = 0;
  } catch (e) {
    failedAttempts++;
    if (failedAttempts >= MAX_FAILURES) {
      document.querySelectorAll('pre').forEach(p => p.style.display = 'none');
      document.body.innerHTML = '<pre>connection lost, restart the webserver and refresh this page</pre>';
      return;
    }
  }
  setTimeout(loop, 2000);
}

loadOrders();
updateButtonStates();

loop();
</script>

</body>
</html>
